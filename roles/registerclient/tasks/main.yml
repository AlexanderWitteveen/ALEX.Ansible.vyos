---

- name: Register DNS
  shell: |
    {% if prop_networkinterfaces is defined %}
      {% for device_network in prop_networkinterfaces %}
        {% if device_network["dns"] is defined %}
          {% for dns in device_network["dns"] %}
            {% for host in hostvars.values() %}
              {% if host["prop_vyos"] is defined and host["prop_vyos"]["interfaces"] is defined %}
                {% for vyos_interface in host["prop_vyos"]["interfaces"] %}
                  {% if vyos_interface["vlans"] is defined %}
                    {% for vlan in vyos_interface["vlans"] %}
                      {% if vlan["dns"] is defined %}
                        {% for vyos_dns in vlan["dns"] %}
                          {% if vyos_dns["domain"] == dns["domain"] %}
                            curl --location --request POST "https://{{ host["prop_host"]["ipaddress"] }}/configure" \
                              --form 'data={"op": "set", "path": ["service", "dns", "forwarding", "authoritative-domain", "{{ dns["domain"] }}", "records", "{{ dns["type"] | default("a") }}", "{{ dns["name"] | default(prop_host.hostname) }}", "address", "{{ device_network["ipaddress"] }}"]}' \
                              --form key="{{ prop_admin_password }}"
                          {% endif %}
                        {% endfor %}
                      {% endif %}
                    {% endfor %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
          {% endfor %}
        {% endif %}
      {% endfor %}
    {% endif %}
  args:
    executable: /bin/bash
  connection: local
  become: true

- name: Register DHCP
  shell: |
    # register DHCP
    {% if prop_networkinterfaces is defined %}
      {% for device_network in prop_networkinterfaces %}
        {% if device_network["vlan"] is defined %}
          {% if device_network["subnet"] is defined %}
            {% for host in hostvars.values() %}
              {% if host["prop_vyos"] is defined and host["prop_vyos"]["dhcp"] is defined %}
                {% for vyos_dhcp in host["prop_vyos"]["dhcp"] %}
                  {% if vyos_dhcp["subnets"] is defined %}
                    {% for subnet in vyos_dhcp["subnets"] %}
                      {% if subnet["ip"] is defined %}
                        {% if subnet["ip"] == device_network["subnet"] %}
                          curl --location --request POST 'https://{{ host["prop_host"]["ipaddress"] }}/configure' \
                            --form 'data=[{"op": "set", "path": ["service", "dhcp-server", "shared-network-name", "{{ device_network["vlan"] }}", "subnet", "{{ device_network["subnet"] }}", "static-mapping", "{{ prop_host.hostname }}", "description", "{{ prop_description | default("[undefined]") }}"]}, 
                                          {"op": "set", "path": ["service", "dhcp-server", "shared-network-name", "{{ device_network["vlan"] }}", "subnet", "{{ device_network["subnet"] }}", "static-mapping", "{{ prop_host.hostname }}", "ip-address", "{{ device_network["ipaddress"] }}"]}, 
                                          {"op": "set", "path": ["service", "dhcp-server", "shared-network-name", "{{ device_network["vlan"] }}", "subnet", "{{ device_network["subnet"] }}", "static-mapping", "{{ prop_host.hostname }}", "mac", "{{ device_network["mac"] }}"]}]' \
                            --form key="{{ prop_admin_password }}"
                        {% endif %}
                      {% endif %}
                    {% endfor %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endif %}
  args:
    executable: /bin/bash
  connection: local
  become: true

- name: Save changes
  shell: |
    # Save changes
    {% if prop_networkinterfaces is defined %}
      {% for device_network in prop_networkinterfaces %}
        {% if device_network["vlan"] is defined %}
          {% if device_network["subnet"] is defined %}
            {% for host in hostvars.values() %}
              {% if host["prop_vyos"] is defined and host["prop_vyos"]["dhcp"] is defined %}
                curl --location --request POST "https://{{ host["prop_host"]["ipaddress"] }}/config-file" \
                  --form 'data={"op": "save"}' \
                  --form key="{{ prop_admin_password }}"
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endif %}
  args:
    executable: /bin/bash
  connection: local
  become: true


# clear dhcp leases
# show dhcp server leases | grep a1213 | while read line; do ip=$(echo $line | awk '{print $1}'); clear dhcp-server lease $ip ; done
