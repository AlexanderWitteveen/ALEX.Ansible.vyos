---

- name: Loop vyos
  ansible.builtin.include_tasks:
    file: loopinterfaces.yml
  loop: "{{ hostvars | list }}"
  loop_control:
    loop_var: vyos_router
  when: >
    hostvars[vyos_router]["prop_vyos"]["dhcp"] is defined and
    hostvars[vyos_router]["prop_host.ipaddress"] is defined 
